name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # --strict so a broken link or a page missing from the nav fails the build
      # rather than shipping quietly.
      - run: mkdocs gh-deploy --force --strict
