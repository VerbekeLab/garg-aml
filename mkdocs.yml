site_name: garg-aml
site_description: Graph-based detection of smurfing patterns in transaction networks
repo_url: https://github.com/VerbekeLab/garg-aml
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }

nav:
  - Home: index.md
  - Decisions: decisions/index.md
